# In-process Kotlin compilation: the separate Kotlin compile daemon cannot open its
# local socket in this sandbox ("Could not connect to Kotlin compile daemon"), so it
# is compiled inside the Gradle JVM instead. Needs a larger heap as a result.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

# KSP's incremental mode restores previously generated sources from a shadow directory
# at the start of each analysis round (updateFromShadow -> copyWithTimestamp). Running
# in-process, as above, that restore collides with the file KSP has already written in
# this same run, and the build dies with FileAlreadyExistsException on
# AppDatabase_Impl.java - from a completely clean tree, so no amount of cache clearing
# helps. Non-incremental KSP skips the shadow directory altogether. It costs a full
# re-process of the annotations on every build; it buys a build that finishes.
ksp.incremental=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
